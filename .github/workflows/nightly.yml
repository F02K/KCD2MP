name: Nightly Build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - config: Debug
            final: "NO"
          - config: RelWithDebInfo
            final: "YES"
    name: Validate ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git .cache/vcpkg
          git -C .cache/vcpkg checkout --detach 908da3a305a0a8028d9602ab241b433652b3df69
          .cache/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-${{ matrix.config }} -G Ninja
          -D CMAKE_BUILD_TYPE=${{ matrix.config }}
          -D FINAL=${{ matrix.final }}
          -D BUILD_TESTING=ON
          -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -D VCPKG_TARGET_TRIPLET=x64-windows-static
          -D VCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake_scripts/vcpkg/ports"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build-${{ matrix.config }} --target KCD2MP KCD2MPServer KCD2MPSignatureAudit KCD2MPSignatureCoreTests KCD2MPEnginePathTests KCD2MPProtocolTests KCD2MPServerCoreTests KCD2MPGameCommandQueueTests KCD2MPNetworkingTests KCD2MPIdentityStoreTests
          ctest --test-dir build-${{ matrix.config }} -C ${{ matrix.config }} -R "^KCD2MP" --output-on-failure

  build_nightly:
    needs: validate
    runs-on: windows-latest
    name: Build Nightly
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      short_sha: ${{ steps.var.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git .cache/vcpkg
          git -C .cache/vcpkg checkout --detach 908da3a305a0a8028d9602ab241b433652b3df69
          .cache/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FINAL=YES -D BUILD_TESTING=ON -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake" -D VCPKG_TARGET_TRIPLET=x64-windows-static -D VCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake_scripts/vcpkg/ports" -S. -Bbuild -G Ninja
        #run: cmake -D CMAKE_BUILD_TYPE=Debug -S. -Bbuild -G Ninja

      - name: Prepare 64bit release DLL
        shell: bash
        run: |
          set -x

          namespace="KCD2MP"
          mod_name="KCD2MP"

          version_number="0.2.0"

          # Remove quotes from output
          version_number=$(echo "$version_number" | tr -d '"')

          # For the FILEVERSION we want a , format
          version_number_comma=$(echo $version_number | tr . ,),0

          cd src
          sed -i 's/FILEVERSION .*/FILEVERSION '"$version_number_comma"'/' resources.rc
          sed -i 's/PRODUCTVERSION .*/PRODUCTVERSION '"$version_number_comma"'/' resources.rc
          sed -i 's/"FileVersion", *"[^"]*"/"FileVersion", "'"$version_number"'"/g' resources.rc
          sed -i 's/"ProductVersion", *"[^"]*"/"ProductVersion", "'"$version_number"'"/g' resources.rc
          cd ..

      - name: Build 64bit release DLL
        run: |
          cmake --build ./build --config RelWithDebInfo --target KCD2MP KCD2MPServer KCD2MPSignatureAudit KCD2MPSignatureCoreTests KCD2MPEnginePathTests KCD2MPProtocolTests KCD2MPServerCoreTests KCD2MPGameCommandQueueTests KCD2MPNetworkingTests KCD2MPIdentityStoreTests --
          ctest --test-dir ./build -C RelWithDebInfo -R "^KCD2MP" --output-on-failure
          #cmake --build ./build --config Debug --target KCD2MP --
          mv ./build/d3d12_.dll ./build/d3d12.dll
          mv ./build/d3d12_.pdb ./build/d3d12.pdb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/d3d12.dll
            build/d3d12.pdb
            build/KCD2MPServer.exe
            build/server.toml.example
      - name: Generate Build Info
        id: var
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

  create_release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: build_nightly
    steps:
      - uses: actions/checkout@v3
  
      - name: Delete Existing Release
        id: delete_release
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "nightly";
      
            // List all releases and find the release by tag
            const releases = await github.rest.repos.listReleases({
              owner: owner,
              repo: repo,
            });
      
            const release = releases.data.find(release => release.tag_name === tag);
      
            // Check if the release exists and delete it
            if (release) {
              await github.rest.repos.deleteRelease({
                owner: owner,
                repo: repo,
                release_id: release.id,
              });
              console.log(`Deleted release with ID ${release.id}`);
            } else {
              console.log("No existing release to delete");
            }
      
            // Delete the tag
            try {
              await github.rest.git.deleteRef({
                owner: owner,
                repo: repo,
                ref: `tags/${tag}`,
              });
              console.log(`Deleted tag ${tag}`);
            } catch (error) {
              console.error(`Error deleting tag: ${error.message}`);
            }

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary

      - name: Echo build sha256
        id: build_sha
        run: |
          sha256sum d3d12.dll > sha256.checksum
          echo "build_sha=$(cat sha256.checksum)" >> $GITHUB_OUTPUT
          cat sha256.checksum

      - name: Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly [${{ needs.build_nightly.outputs.short_sha }}]
          tag_name: nightly
          body: |
            **This release has been built by Github Actions**
            [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Build SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```
            To verify the build SHA256 during the action, click the build link, go-to "Create Release", open the Echo build sha256 step and read the sha256.

            You can download the build artifacts, generate a SHA256 checksum and compare it with the below binary.
            Build artifacts ARE NOT automatically the same as release assets since release assets can be modified afterwards.

            Full Commit Hash:
            ```
            ${{ needs.build_nightly.outputs.full_sha }}
            ```
          files: |
            d3d12.dll
